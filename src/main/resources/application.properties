spring.application.name=fleetops

server.port=${PORT:9091}

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/fleetops_new?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Disable SQL logging in production
spring.jpa.show-sql=${LOG_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Logging
# ===============================
logging.level.org.springframework.web=${LOG_LEVEL:INFO}
logging.level.com.fleetops=${LOG_LEVEL:INFO}

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads/}
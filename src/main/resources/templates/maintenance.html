<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - FleetOps</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/vehicle.css"> <!-- Reusing generic styles -->
    <link rel="stylesheet" href="/css/maintenance.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar (Reused) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">🚚</div>
                <h2>FleetOps</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="/dashboard"><span class="icon">📊</span> Dashboard</a></li>
                    <li><a href="/vehicles"><span class="icon">🚛</span> Vehicles</a></li>
                    <li><a href="/drivers"><span class="icon">👤</span> Drivers</a></li>
                    <li><a href="/fuel"><span class="icon">💧</span> Fuel Logs</a></li>
                    <li><a href="/maintenance" class="active"><span class="icon">🔧</span> Maintenance</a></li>
                    <li><a href="/reports"><span class="icon">📈</span> Reports</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="/login" class="logout-link"><span class="icon">🚪</span> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <!-- Top Navbar (Reused) -->
            <header class="topbar">
                <div class="topbar-title">
                    <h1>Maintenance Logs</h1>
                </div>
                <div class="topbar-info">
                    <div class="current-date" id="currentDate">Loading date...</div>
                    <div class="user-profile">
                        <div class="avatar">JM</div>
                        <div class="user-info">
                            <span class="user-name">John Manager</span>
                            <span class="user-role">Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Maintenance Content -->
            <main class="content">
                
                <!-- Toolbar -->
                <div class="toolbar">
                    <div class="toolbar-left">
                        <div class="search-box">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="searchInput" placeholder="Search by garage..." onkeyup="searchMaintenance()">
                        </div>
                        <div class="filter-box">
                            <select id="vehicleFilter" onchange="filterMaintenance()">
                                <option value="">All Vehicles</option>
                                <!-- Injected dynamically by JS -->
                            </select>
                        </div>
                        <div class="filter-box">
                            <select id="statusFilter" onchange="filterMaintenance()">
                                <option value="">All Statuses</option>
                                <option value="SCHEDULED">Scheduled</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="CANCELLED">Cancelled</option>
                            </select>
                        </div>
                        <button class="btn-secondary" style="padding: 8px 12px;" onclick="clearFilters()">Clear</button>
                    </div>
                    <div class="toolbar-right">
                        <button class="btn-primary" onclick="openAddModal()">+ Add Record</button>
                    </div>
                </div>

                <!-- Maintenance Table -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Vehicle</th>
                                <th>Garage</th>
                                <th>Service Date</th>
                                <th>Next Service</th>
                                <th>Cost</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="maintenanceTableBody">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Controls -->
                <div class="pagination">
                    <span class="page-info">Showing 0 entries</span>
                    <div class="page-buttons"></div>
                </div>

            </main>
        </div>
    </div>

    <!-- Add/Edit Maintenance Modal -->
    <div id="maintenanceModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modalTitle">Add Maintenance Record</h2>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="maintenanceForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="maintenanceId">
                <div class="modal-body">
                    <div class="form-row single-col">
                        <div class="input-group">
                            <label for="vehicleId">Vehicle *</label>
                            <select id="vehicleId" required>
                                <option value="">Select a Vehicle...</option>
                                <!-- Injected dynamically by JS -->
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label for="garage">Garage / Workshop *</label>
                            <input type="text" id="garage" required>
                        </div>
                        <div class="input-group">
                            <label for="cost">Service Cost ($) *</label>
                            <input type="number" step="0.01" id="cost" min="0" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label for="serviceDate">Service Date *</label>
                            <input type="date" id="serviceDate" required>
                        </div>
                        <div class="input-group">
                            <label for="nextServiceDate">Next Scheduled Service *</label>
                            <input type="date" id="nextServiceDate" required>
                        </div>
                    </div>
                    <div class="form-row single-col">
                        <div class="input-group">
                            <label for="status">Maintenance Status *</label>
                            <select id="status" required>
                                <option value="">Select...</option>
                                <option value="SCHEDULED">Scheduled</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="CANCELLED">Cancelled</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/maintenance.js"></script>
</body>
</html>
